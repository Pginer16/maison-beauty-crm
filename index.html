r')=>`<form onsubmit="${handler}">${body}<button>${text}</button></form>`;const data=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};function notify(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2600)}function save(message='Cambios guardados'){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{notify('No se pudo guardar en el navegador');render();return}render();notify(message)}function go(p){page=p;clientPage=1;render();window.scrollTo(0,0)}function modal(title,html){$('detail').innerHTML=`<div class="top"><h2>${title}</h2><button class="secondary" onclick="document.getElementById('detail').close()">Cerrar</button></div>${html}`;$('detail').showModal()}const close=()=>$('detail').close();function heading(t,s,b=''){return `<div class="eyebrow">Maison Beauty / Pastel CRM</div><div class="top"><div><h1>${t}</h1><p class="muted">${s}</p></div>${b}</div>`}const kpi=(label,v,sub='')=>`<div class="card"><div class="eyebrow">${label}</div><div class="num">${v}</div><span class="muted">${sub}</span></div>`;const monthLogs=()=>db.logs.filter(l=>l.date.startsWith(month()));function chart(){let vals=Array.from({length:6},(_,i)=>{let m=monthAgo(5-i);return [m,sum(db.logs.filter(l=>l.date.startsWith(m)))]});let max=Math.max(1,...vals.map(x=>x[1]));return `<div class="chart">${vals.map(([m,v])=>`<div><span>${eur(v)}</span><b style="height:${v/max*115}px"></b>${m.slice(5)}/${m.slice(2,4)}</div>`).join('')}</div>`}function apptTable(a){return table(['Fecha','Hora','Clienta','Tratamiento','Estado','Acciones'],a.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)).map(x=>`<tr><td>${x.date}</td><td>${x.time}</td><td>${name(x.client)}</td><td>${esc(x.service)}</td><td>${tag(x.status)}</td><td>${x.status==='Reservada'?btn('Realizar','completeAppt',x.id)+' '+btn('Editar','editAppt',x.id)+' '+btn('Cancelar','cancelAppt',x.id):'—'}</td></tr>`))}function render(){let pages=[['Dashboard','◈'],['Clientas','♙'],['Agenda','▦'],['Actividad','≡'],['Seguimientos','◷'],['Marketing','♡'],['Facturación','€'],['Oportunidades','✧'],['Tarifas','◇'],['Navidad','✦'],['Preguntas frecuentes','?']];$('nav').innerHTML=pages.map(([p,i])=>`<button class="${p===page?'on':''}" onclick="go('${p}')"><span>${i}</span>${p}</button>`).join('');let m=$('main'),income=sum(monthLogs()),pending=db.tasks.filter(t=>!t.done),active=db.clients.filter(c=>['VIP','Habitual','Nueva'].includes(segment(c))).length,appts=db.appointments.filter(a=>a.status==='Reservada'&&a.date>=today());let html='';if(page==='Preguntas frecuentes')html=faqPage();if(page==='Tarifas')html=tariffPage();if(page==='Navidad')html=christmasPage();if(page==='Dashboard'){html=heading('Resumen del estudio','Agenda, actividad comercial y seguimiento de clientas.',`<button onclick="editAppt()">+ Nueva cita</button>`)+`<div class="hero"><div class="eyebrow">Gestión diaria</div><h2>Tu estudio, al día</h2><p>Consulta las próximas citas y las tareas que requieren atención.</p><p><button onclick="go('Navidad')">Ver campaña de Navidad</button></p><span class="muted">${new Date().toLocaleDateString('es-ES',{dateStyle:'full'})}</span></div><div class="quick-actions"><button onclick="editClient()">+ Nueva clienta</button><button onclick="editLog()">+ Registrar actividad</button><button onclick="editTask()">+ Seguimiento</button><button onclick="go('Tarifas')">Consultar tarifas</button></div><div class="cards">${kpi('Clientas activas',active,'De '+db.clients.length+' fichas')}${kpi('Ingresos del mes',eur(income),'Visitas y ventas')}${kpi('Citas de hoy',appts.filter(a=>a.date===today()).length,'Reservas confirmadas')}${kpi('Seguimientos',pending.length,pending.filter(t=>t.date<today()).length+' vencidos')}</div><div class="split"><section><h2>Evolución de ingresos</h2><p class="muted">Últimos seis meses</p>${chart()}</section><section><h2>Próximas citas</h2>${appts.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4).map(a=>`<div c function listClients(){let q=normalize($('search').value),f=$('filter').value;let cs=db.clients.filter(c=>normalize([c.name,c.email,c.service].join(' ')).includes(q)&&(f==='Todas'||segment(c)===f));let order=$('sortClients').value;cs.sort((a,b)=>order==='spend'?sum(history(b))-sum(history(a)):order==='last'?(last(b)||'').localeCompare(last(a)||''):a.name.localeCompare(b.name,'es'));let total=cs.length,pages=Math.max(1,Math.ceil(total/15));clientPage=Math.min(clientPage,pages);let start=(clientPage-1)*15;$('count').textContent=total+' clientas';$('clientList').innerHTML=table(['Clienta','Correo electrónico','Tratamiento','Segmento','Gasto',''],cs.slice(start,start+15).map(c=>`<tr><td><span class="avatar">${esc(c.name.split(' ').map(n=>n[0]).slice(0,2).join(''))}</span>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.service)}</td><td>${tag(segment(c))}</td><td>${eur(sum(history(c)))}</td><td>${btn('Ver ficha','editClient',c.id)}</td></tr>`))+`<div class="pager"><span class="muted">${total?start+1:0}–${Math.min(start+15,total)} de ${total} clientas</span><div><button class="secondary" ${clientPage===1?'disabled':''} onclick="clientPage--;listClients()">Anterior</button> <span> ${clientPage} / ${pages} </span> <button class="secondary" ${clientPage===pages?'disabled':''} onclick="clientPage++;listClients()">Siguiente</button></div></div>`}function editClient(x){let c=client(x)||{name:'',email:'',phone:'',service:services[0],birthday:'',notes:''};modal(x?esc(c.name):'Nueva clienta',form(`storeClient(event,'${x||''}')`,field('Nombre y apellidos','name',c.name,'text','required')+field('Correo electrónico','email',c.email,'email')+field('Teléfono','phone',c.phone)+field('Cumpleaños','birthday',c.birthday,'date')+sel('Tratamiento habitual','service',opts(services,c.service))+field('Observaciones','notes',c.notes)+profileFields(c))+(x?profileOverview(c)+`<div class="cards">${kpi('Segmento',tag(segment(c)))}${kpi('Gasto acumulado',eur(sum(history(c))))}${kpi('Última visita',last(c)||'Sin visitas')}</div><h2>Historial</h2>${logTable(history(c),false)}`:''))}function storeClient(e,x){let d=data(e);d.name=d.name.trim();if(!d.name)return;if(!d.email)d.email=normalize(d.name).replace(/\s+/g,'.')+'@example.com';if(x)Object.assign(client(x),d);else db.clients.push({...d,id:id()});close();save()}
function filterAgenda(){$('agendaList').innerHTML=apptTable(db.appointments.filter(a=>!$('agendaDate').value||a.date===$('agendaDate').value))}function editAppt(x){let a=db.appointments.find(a=>a.id===x)||{date:today(),time:'10:00',service:services[0]};modal(x?'Editar cita':'Nueva reserva',form(`storeAppt(event,'${x||''}')`,sel('Clienta','client',clientOpts(a.client))+field('Fecha','date',a.date,'date','required')+field('Hora','time',a.time,'time','required step="1800"')+sel('Tratamiento','service',opts(services.slice(0,8),a.service))))}function storeAppt(e,x){let d=data(e);let mins=t=>Number(t.split(':')[0])*60+Number(t.split(':')[1]);if(db.appointments.some(a=>a.id!==x&&a.status==='Reservada'&&a.date===d.date&&Math.abs(mins(a.time)-mins(d.time))<60)){alert('Ya existe una cita en esa franja. Cada reserva ocupa 60 minutos.');return}if(x)Object.assign(db.appointments.find(a=>a.id===x),d);else db.appointments.push({...d,id:id(),status:'Reservada'});close();save('Cita guardada')}function completeAppt(x){let a=db.appointments.find(a=>a.id===x);if(a.status!=='Reservada')return;if(a.date>today()){alert('No se puede completar una cita futura.');return}a.status='Realizada';db.logs.push({id:id(),client:a.client,date:a.date,type:'Visita',service:a.service,amount:prices[services.indexOf(a.service)],note:'Cita realizada'});save('Visita e ingreso registrados')}function cancelAppt(x){if(confirm('¿Cancelar esta reserva?')){db.appointments.find(a=>a.id===x).status='Cancelada';save()}}
function logTable(ls,actions){return table(['Fecha','Clienta','Tipo','Tratamiento','Importe','Nota',...(actions?['Acciones']:[])],[...ls].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<tr><td>${l.date}</td><td>${name(l.client)}</td><td>${esc(l.type)}</td><td>${esc(l.service)}</td><td>${eur(l.amount)}</td><td>${esc(l.note)}</td>${actions?`<td>${btn('Editar','editLog',l.id)} ${btn('Eliminar','deleteLog',l.id,'danger')}</td>`:''}</tr>`))}function editLog(x){let l=db.logs.find(l=>l.id===x)||{date:today(),type:'Visita',service:services[0],amount:35,note:''};modal(x?'Editar actividad':'Registrar actividad',form(`storeLog(event,'${x||''}')`,sel('Clienta','client',clientOpts(l.client))+field('Fecha','date',l.date,'date',`required max="${today()}"`)+sel('Tipo','type',opts(['Visita','Venta','Contacto'],l.type))+sel('Tratamiento','service',opts(services,l.service))+field('Importe (€)','amount',l.amount,'number','required min="0" step="0.01"')+field('Nota','note',l.note))+'<p class="muted">Los contactos no generan ingresos.</p>')}function storeLog(e,x){let d=data(e);d.amount=d.type==='Contacto'?0:Number(d.amount);if(x)Object.assign(db.logs.find(l=>l.id===x),d);else db.logs.push({...d,id:id()});close();save()}function deleteLog(x){if(confirm('¿Eliminar este registro?')){db.logs=db.logs.filter(l=>l.id!==x);save()}}
function editTask(x){let t=db.tasks.find(t=>t.id===x)||{date:today(),note:''};modal(x?'Editar seguimiento':'Nuevo seguimiento',form(`storeTask(event,'${x||''}')`,sel('Clienta','client',clientOpts(t.client))+field('Fecha','date',t.date,'date','required')+field('Acción','note',t.note,'text','required')))}function storeTask(e,x){let d=data(e);if(x)Object.assign(db.tasks.find(t=>t.id===x),d);else db.tasks.push({...d,id:id(),done:false});close();save()}function toggleTask(x){let t=db.tasks.find(t=>t.id===x);t.done=!t.done;save()}function deleteTask(x){if(confirm('¿Eliminar el seguimiento?')){db.tasks=db.tasks.filter(t=>t.id!==x);save()}}function suggestTask(x){let c=client(x),s=segment(c),note=s==='VIP'?'Ofrecer ventaja VIP':s==='Habitual'?'Recomendar tratamiento complementario':s==='Potencial'?'Invitar a primera visita':'Contactar para reactivación';if(db.tasks.some(t=>String(t.client)===String(x)&&t.note===note&&!t.done)){notify('Ya existe un seguimiento pendiente');return}db.tasks.push({id:id(),client:x,date:today(),note,done:false});save('Seguimiento creado')}
function campaign(s){let cs=db.clients.filter(c=>segment(c)===s&&c.marketingConsent==='Sí'),messages=cs.map(c=>`Hola, ${c.name.split(' ')[0]}. ${s==='VIP'?'Queremos agradecer tu confianza con una experiencia exclusiva.':s==='Nueva'?'Gracias por tu primera visita. Nos encantará volver a verte.':s==='Habitual'?'¿Te apetece descubrir un nuevo tratamiento?':s==='Potencial'?'Te invitamos a conocer nuestro estudio.':'Te echamos de menos. ¿Te gustaría reservar una nueva cita?'} Un abrazo, Maison Beauty.`);modal('Campaña · '+esc(s),`<p>${cs.length} borradores de mensajes (no enviados).</p><textarea id="messages" rows="12" style="width:100%">${esc(messages.join('\n\n'))}</textarea><button onclick="copyMessages()">Copiar mensajes</button>`)}async function copyMessages(){try{await navigator.clipboard.writeText($('messages').value);notify('Mensajes copiados')}catch{$('messages').select();notify('Seleccionados: pulsa Ctrl/Cmd+C')}}function downloadFile(filename,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportCSV(){let cell=x=>'"'+String(x??'').replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"';downloadFile('maison-ingresos.csv','\ufeff'+[['Fecha','Clienta','Tipo','Tratamiento','Importe'],...db.logs.filter(paid).map(l=>[l.date,client(l.client)?.name,l.type,l.service,String(l.amount).replace('.',',')])].map(r=>r.map(cell).join(';')).join('\n'),'text/csv;charset=utf-8')}function backup(){downloadFile('maison-backup.json',JSON.stringify(db,null,2),'application/json')}function resetDemo(){if(confirm('¿Restaurar los datos iniciales? Se perderán los cambios locales.')){db=seed();save('Demo restaurada')}}
const offers=[{name:'Winter Glow',desc:'Tratamiento facial + diseño de cejas',regular:105},{name:'Christmas Ritual',desc:'Masaje relajante + higiene facial',regular:125},{name:'Maison Signature',desc:'Facial + manicura + pedicura + diseño de cejas',regular:185},{name:'Bono manicura 4 sesiones',desc:'Cuatro manicuras clásicas. Validez propuesta: 6 meses.',regular:140},{name:'Tarjeta regalo 50 €',desc:'Saldo para regalar una experiencia a elegir.',regular:50},{name:'Tarjeta regalo 100 €',desc:'Saldo para regalar una experiencia a elegir.',regular:100}];
function tariffPage(){return heading('Carta de tratamientos','Tarifas ficticias del estudio · IVA incluido a efectos de la demo.')+`<section><h2>Beauty menu</h2><div class="photo-strip">${photo(3)}${photo(0)}${photo(1)}</div>${table(['Tratamiento','Precio','Acción'],services.slice(0,8).map((s,i)=>`<tr><td>${s}</td><td>${eur(prices[i])}</td><td>${btn('Registrar venta','sellOffer',i)}</td></tr>`))}</section><section><h2>Bonos y experiencias</h2>${table(['Experiencia','Precio','Acción'],services.slice(8).map((s,i)=>`<tr><td>${s}</td><td>${eur(prices[i+8])}</td><td>${btn('Registrar venta','sellOffer',i+8)}</td></tr>`))}</section>`}
function christmasPage(){let sales=db.logs.filter(l=>l.type==='Venta'&&offers.some(o=>o.name===l.service));return heading('Maison Christmas','Regala tiempo, belleza y bienestar.')+`<div class="holiday"><div class="eyebrow">The gifting season · edición especial</div><h2>Un regalo para recordar.</h2><p>Experiencias de belleza, envueltas en un detalle especial.</p><p>✦ Campaña propuesta: 1 de diciembre – 6 de enero</p><button onclick="christmasMessages()">Preparar campaña personalizada</button></div><div class="cards">${kpi('Ventas de packs y tarjetas',sales.length)}${kpi('Ingresos de estas ventas',eur(sum(sales)))}</div><div class="offergrid">${offers.map((o,i)=>`<div class="offer">${photo(i)}<span class="ribbon">${i<3?'Christmas collection':i===3?'Beauty membership':'Gift card'}</span><h3>${o.name}</h3><p>${o.desc}</p><div class="num">${eur(prices[i+8])}</div><p><small>${o.regular>prices[i+8]?'Valor por separado '+eur(o.regular)+' · ahorro '+eur(o.regular-prices[i+8]):'Importe del regalo'}</small></p>${btn('Registrar venta','sellOffer',i+8,'')}</div>`).join('')}</div><section><h2>Historial de ventas de regalos</h2>${logTable(sales,true)}<p class="muted">Fotografías de inspiración externas: Marriott, Elle, Ongle24, The Green Jungle Beauty Shop y Pexels. No representan productos propios. Demo: registra ventas, no emite tarjetas canjeables ni controla saldo o sesiones. El canje no está implementado.</p></section>`}
function sellOffer(i){i=Number(i);modal('Venta · '+services[i],form(`storeOffer(event,${i})`,sel('Clienta','client',clientOpts())+field('Fecha','date',today(),'date',`required max="${today()}"`)+field('Nota / destinataria ficticia','note')+`<p>Total: <b>${eur(prices[i])}</b></p>`,'Confirmar venta'))}
function storeOffer(e,i){let d=data(e);if(!client(d.client)||!d.date||d.date>today())return;db.logs.push({id:id(),client:d.client,date:d.date,type:'Venta',service:services[i],amount:prices[i],note:d.note||'Venta desde catálogo'});close();save('Venta registrada en facturación')}
function christmasMessages(){let cs=db.clients.filter(c=>['VIP','Habitual','En riesgo'].includes(segment(c))&&c.marketingConsent==='Sí');modal('Campaña Maison Christmas',`<p>${cs.length} borradores personalizados · sin envío real</p><textarea id="messages" rows="12" style="width:100%">${esc(cs.map(c=>`Hola, ${c.name.split(' ')[0]}. Esta Navidad regala bienestar con Maison Beauty: descubre Winter Glow por 99 € o nuestras tarjetas regalo desde 50 €. ¡Felices fiestas!`).join('\n\n'))}</textarea><button onclick="copyMessages()">Copiar mensajes</button>`)}


const photoURLs=['https://cache.marriott.com/content/dam/marriott-renditions/GVALC/gvalc-gift-box-5289-hor-clsc.jpg?downsize=1300px%3A%2A&interpolation=progressive-bilinear&output-quality=70','https://hips.hearstapps.com/hmg-prod/images/123-1668762586.jpg?crop=0.669xw%3A1.00xh%3B0.159xw%2C0&resize=640%3A%2A','https://ongle24.com/cdn/shop/files/Home-Teaser-Kat1-1_Neuheiten.webp?v=1762178428&width=400','https://thegreenjunglebeautyshop.com/cdn/shop/files/manucurist-semi-permanent-led-green-flash-nail-polish-mocha-the-green-jungle-beauty-shop-nails-swatch.webp?v=1761137267&width=800','https://images.pexels.com/photos/5485987/pexels-photo-5485987.jpeg?w=700','https://images.pexels.com/photos/5588627/pexels-photo-5588627.jpeg?w=700'];
const photo=i=>`<div class="photo-frame"><span class="fallback">MAISON<br>BEAUTY ✧</span><img src="${photoURLs[i]}" alt="Inspiración editorial de belleza y regalos" loading="lazy" onerror="this.remove()"></div>`;
function profileDefaults(c){let i=Number(c.id)||0;let frequent=history(c).filter(l=>l.type==='Visita').length>=2;return {channel:c.channel??(frequent?['WhatsApp','Email','Teléfono'][i%3]:'Sin especificar'),timePref:c.timePref??(frequent?['Mañanas','Tardes','Flexible'][i%3]:'Sin especificar'),stylePref:c.stylePref??(frequent?['Acabados naturales','Rituales de bienestar','Experiencias premium'][i%3]:'Sin especificar'),marketingConsent:c.marketingConsent??'No registrado'};}
function profileFields(c){let d=profileDefaults(c);return sel('Canal preferido','channel',opts(['Sin especificar','WhatsApp','Email','Teléfono'],d.channel))+sel('Horario preferido','timePref',opts(['Sin especificar','Mañanas','Tardes','Flexible'],d.timePref))+field('Preferencias de belleza','stylePref',d.stylePref)+sel('Permiso comercial (demo)','marketingConsent',opts(['No registrado','Sí','No'],d.marketingConsent));}
function profileOverview(c){let h=history(c),vis=h.filter(l=>l.type==='Visita'),d=profileDefaults(c),next=db.appointments.filter(a=>String(a.client)===String(c.id)&&a.status==='Reservada'&&a.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0],paidLogs=h.filter(paid);return `<div class="profile-note"><div class="eyebrow">Beauty passport · perfil de fidelización</div><div class="cards">${kpi('Visitas',vis.length)}${kpi('Ticket medio',eur(paidLogs.length?sum(h)/paidLogs.length:0))}${kpi('Próxima cita',next?next.date:'Sin reserva')}${kpi('Regalos comprados',h.filter(l=>l.type==='Venta'&&services.slice(8).includes(l.service)).length)}</div><p><b>Preferencias:</b> ${esc(d.stylePref)} · ${esc(d.timePref)} · ${esc(d.channel)}</p><p><b>Oportunidad:</b> ${['VIP','Habitual'].includes(segment(c))?'Ofrecer una experiencia complementaria o un bono de fidelización.':'Invitar a reservar una nueva experiencia.'}</p><p class="muted">Preferencias iniciales simuladas y editables. No se envían mensajes reales.</p></div>`;}
const faqs=[['Reservas','¿Cómo puedo reservar una cita?','Desde la agenda del estudio se selecciona clienta, tratamiento, día y hora.'],['Reservas','¿Puedo cambiar o cancelar una cita?','Sí, desde Agenda se puede editar o cancelar una reserva. Como política propuesta, avisar con 24 horas de antelación.'],['Tratamientos','¿Dónde consulto las tarifas?','En el apartado Tarifas se encuentra la carta completa de tratamientos y experiencias.'],['Tratamientos','¿Cuánto duran los tratamientos?','En esta demo cada cita ocupa 60 minutos. La duración real dependería del servicio.'],['Regalos','¿Qué packs hay para Navidad?','Winter Glow (99 €), Christmas Ritual (119 €) y Maison Signature (159 €).'],['Regalos','¿Puedo regalar una tarjeta sin elegir tratamiento?','Sí, se ofrecen tarjetas de 50 € y 100 €. La demo registra su venta, pero no controla el saldo ni el canje.'],['Regalos','¿Hasta cuándo está disponible la campaña?','La campaña propuesta va del 1 de diciembre al 6 de enero.'],['Fidelización','¿Cómo funciona el bono de manicura?','Incluye cuatro manicuras clásicas por 120 €. La validez propuesta es de seis meses; el control de sesiones no está implementado.'],['Fidelización','¿Cómo se identifica una clienta VIP?','El CRM utiliza el historial: gasto acumulado de al menos 300 € y visita en los últimos 45 días.'],['Privacidad','¿Son reales los datos de las clientas?','No. Los 120 perfiles son ficticios y el almacenamiento es local en el navegador.']];
function faqPage(){return heading('Preguntas frecuentes','Guía de atención al cliente · respuestas del estudio')+`<section class="faq"><input id="faqSearch" placeholder="Buscar una pregunta…" oninput="filterFAQ()" style="width:100%"><div id="faqList">${faqItems('')}</div></section>`;}
function faqItems(q){let f=faqs.filter(a=>normalize(a.join(' ')).includes(normalize(q)));return f.map(([cat,title,answer])=>`<details><summary>${esc(title)}</summary><p class="eyebrow">${esc(cat)}</p><p>${esc(answer)}</p></details>`).join('')||'<p>No hay resultados.</p>';}
function filterFAQ(){$('faqList').innerHTML=faqItems($('faqSearch').value)}

render();
</script></body></html>
